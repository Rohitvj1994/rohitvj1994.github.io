<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WiseWatt — Reading India's Energy Transition</title>
<meta name="description" content="An independent journal on India's energy transition. Policy, technology, global lessons and the grid behind it all." />
 
<!-- Fonts: editorial serif + modern sans + mono -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Geist:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
 
<style>
  /* ============ DESIGN TOKENS ============ */
  :root {
    --bg:        #0B0D10;
    --bg-soft:   #11141A;
    --surface:   #161A21;
    --line:      #262C36;
    --line-soft: #1C2129;
 
    --ink:       #F2EBD9;   /* warm cream */
    --ink-mute:  #9A9485;
    --ink-dim:   #5F5B52;
 
    --ember:     #E0A458;   /* solar warm */
    --ember-hot: #F2B968;
    --electric:  #6BCEEB;   /* cool blue */
    --grid:      #5DAE7B;   /* line green */
    --red:       #D86B5C;   /* fault/coal */
 
    --grad-ember: linear-gradient(135deg, #F2B968 0%, #E0A458 50%, #C4823F 100%);
    --grad-cool:  linear-gradient(135deg, #6BCEEB 0%, #5DAE7B 100%);
 
    --font-display: 'Fraunces', ui-serif, Georgia, serif;
    --font-sans:    'Geist', ui-sans-serif, system-ui, sans-serif;
    --font-mono:    'JetBrains Mono', ui-monospace, monospace;
 
    --maxw: 1240px;
    --ease: cubic-bezier(.2,.7,.2,1);
  }
 
  body.light {
    --bg:        #F2EBD9;
    --bg-soft:   #EDE4CD;
    --surface:   #E6DCC1;
    --line:      #C9BFA4;
    --line-soft: #D7CDB2;
    --ink:       #1A1814;
    --ink-mute:  #5C574B;
    --ink-dim:   #8A8472;
  }
 
  /* ============ RESET / BASE ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--ink);
    font-feature-settings: "ss01","cv11";
    line-height: 1.5;
    overflow-x: hidden;
    transition: background .5s var(--ease), color .5s var(--ease);
  }
  a { color: inherit; text-decoration: none; }
  img, svg { display: block; max-width: 100%; }
 
  /* ============ NAV ============ */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: color-mix(in oklab, var(--bg) 70%, transparent);
    border-bottom: 1px solid transparent;
    transition: border-color .3s var(--ease), background .3s var(--ease);
  }
  .nav.scrolled { border-bottom-color: var(--line-soft); }
  .nav-inner {
    max-width: var(--maxw); margin: 0 auto;
    padding: .9rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
    gap: 1.5rem;
  }
  .brand {
    display: flex; align-items: center; gap: .6rem;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.3rem;
    letter-spacing: -.01em;
  }
  .brand-mark {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--grad-ember);
    box-shadow: 0 0 0 1px var(--line), 0 0 24px -2px var(--ember);
    position: relative;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 6px;
    border-radius: 50%; background: var(--bg);
    box-shadow: inset 0 0 0 2px var(--ember);
  }
  .brand em {
    font-style: italic; font-weight: 400;
    color: var(--ink-mute);
  }
  .nav-meta {
    display: flex; align-items: center; gap: 1.5rem;
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .nav-meta .dot {
    display: inline-block;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--grid);
    margin-right: .4rem;
    animation: pulse 2s var(--ease) infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: .4; transform: scale(.8); }
  }
  .theme-btn {
    background: none; border: 1px solid var(--line);
    color: var(--ink); width: 34px; height: 34px;
    border-radius: 50%; cursor: pointer;
    display: grid; place-items: center;
    transition: all .2s var(--ease);
  }
  .theme-btn:hover { border-color: var(--ember); color: var(--ember); }
  @media (max-width: 720px){
    .nav-meta .label-hide { display: none; }
  }
 
  /* ============ HERO ============ */
  .hero {
    position: relative;
    padding: 9rem 1.5rem 4rem;
    max-width: var(--maxw); margin: 0 auto;
    min-height: 100vh;
    display: flex; flex-direction: column; justify-content: center;
  }
  .hero-grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size: 80px 80px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 75%);
    opacity: .5;
    pointer-events: none;
  }
  .hero-label {
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ember);
    margin-bottom: 2rem;
    display: flex; align-items: center; gap: .8rem;
    opacity: 0; animation: rise .8s var(--ease) .1s forwards;
  }
  .hero-label::before {
    content: ""; width: 32px; height: 1px; background: var(--ember);
  }
  .hero h1 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144, "SOFT" 50;
    font-weight: 350;
    font-size: clamp(2.4rem, 7vw, 6rem);
    line-height: .98;
    letter-spacing: -0.03em;
    max-width: 18ch;
    margin-bottom: 2rem;
  }
  .hero h1 .word {
    opacity: 0;
    display: inline-block;
    animation: rise .9s var(--ease) forwards;
  }
  .hero h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--ember);
    font-variation-settings: "opsz" 144, "SOFT" 100;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero-sub {
    font-size: clamp(1rem, 1.4vw, 1.2rem);
    color: var(--ink-mute);
    max-width: 52ch;
    margin-bottom: 3rem;
    line-height: 1.55;
    opacity: 0;
    animation: rise .9s var(--ease) .9s forwards;
  }
  .hero-sub strong {
    color: var(--ink);
    font-weight: 500;
  }
  .hero-cta {
    display: flex; gap: 1rem; flex-wrap: wrap;
    opacity: 0;
    animation: rise .9s var(--ease) 1.1s forwards;
  }
  .btn {
    display: inline-flex; align-items: center; gap: .6rem;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: .95rem;
    padding: .9rem 1.4rem;
    border-radius: 100px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: all .25s var(--ease);
  }
  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }
  .btn-primary:hover {
    background: var(--ember);
    border-color: var(--ember);
    color: #1A1814;
    transform: translateY(-2px);
  }
  .btn:hover { border-color: var(--ember); color: var(--ember); }
  .btn .arrow { transition: transform .25s var(--ease); }
  .btn:hover .arrow { transform: translateX(4px); }
 
  /* Hero live counter */
  .hero-pulse {
    margin-top: 5rem;
    padding: 1.2rem 1.5rem;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: color-mix(in oklab, var(--surface) 60%, transparent);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; gap: 1.2rem;
    flex-wrap: wrap;
    max-width: 720px;
    opacity: 0;
    animation: rise 1s var(--ease) 1.4s forwards;
  }
  .hero-pulse .icon {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: color-mix(in oklab, var(--ember) 15%, transparent);
    border: 1px solid color-mix(in oklab, var(--ember) 30%, transparent);
    display: grid; place-items: center;
    color: var(--ember);
    flex-shrink: 0;
  }
  .hero-pulse .copy {
    flex: 1; min-width: 200px;
    font-size: .92rem;
    color: var(--ink-mute);
    line-height: 1.4;
  }
  .hero-pulse .copy b {
    color: var(--ink);
    font-weight: 500;
  }
  .hero-pulse .num {
    font-family: var(--font-mono);
    font-size: 1.4rem;
    color: var(--ember);
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .hero-pulse small {
    display: block;
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: .15rem;
  }
 
  /* Scroll indicator */
  .scroll-hint {
    position: absolute;
    bottom: 2rem; left: 50%;
    transform: translateX(-50%);
    font-family: var(--font-mono);
    font-size: .7rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ink-dim);
    display: flex; flex-direction: column; align-items: center; gap: .6rem;
    opacity: 0;
    animation: rise 1s var(--ease) 1.8s forwards;
  }
  .scroll-hint .line {
    width: 1px; height: 32px;
    background: linear-gradient(to bottom, var(--ember), transparent);
    animation: scrollLine 2.2s var(--ease) infinite;
  }
  @keyframes scrollLine {
    0% { transform: scaleY(0); transform-origin: top; }
    50% { transform: scaleY(1); transform-origin: top; }
    50.01% { transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }
 
  /* ============ SECTION COMMON ============ */
  section {
    padding: 6rem 1.5rem;
    max-width: var(--maxw); margin: 0 auto;
    position: relative;
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--ember);
    margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: .8rem;
  }
  .eyebrow::before {
    content: ""; width: 24px; height: 1px; background: currentColor;
  }
  h2.display {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144;
    font-weight: 350;
    font-size: clamp(2rem, 4.5vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -.025em;
    max-width: 22ch;
    margin-bottom: 1.5rem;
  }
  h2.display em {
    font-style: italic;
    color: var(--ember);
    font-weight: 300;
  }
  .lede {
    font-size: 1.1rem;
    color: var(--ink-mute);
    max-width: 60ch;
    line-height: 1.55;
  }
 
  /* ============ PULSE STRIP ============ */
  .pulse-section {
    padding-top: 3rem;
    padding-bottom: 3rem;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    max-width: 100%;
    background: var(--bg-soft);
  }
  .pulse-grid {
    max-width: var(--maxw); margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
  }
  .stat {
    padding: 1rem 1.5rem;
    border-left: 1px solid var(--line-soft);
    position: relative;
  }
  .stat:first-child { border-left: 0; }
  .stat-label {
    font-family: var(--font-mono);
    font-size: .68rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-bottom: .6rem;
    display: flex; align-items: center; gap: .5rem;
  }
  .stat-label .dot-live {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--grid);
    animation: pulse 2s var(--ease) infinite;
  }
  .stat-value {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144;
    font-weight: 400;
    font-size: clamp(1.6rem, 3vw, 2.3rem);
    line-height: 1;
    letter-spacing: -.02em;
  }
  .stat-value .unit {
    font-family: var(--font-mono);
    font-size: .85rem;
    color: var(--ink-mute);
    margin-left: .3rem;
    letter-spacing: .05em;
  }
  .stat-note {
    font-size: .78rem;
    color: var(--ink-mute);
    margin-top: .5rem;
    line-height: 1.35;
  }
  @media (max-width: 800px){
    .pulse-grid { grid-template-columns: repeat(2, 1fr); }
    .stat:nth-child(3) { border-left: 0; border-top: 1px solid var(--line-soft); }
    .stat:nth-child(4) { border-top: 1px solid var(--line-soft); }
  }
 
  /* ============ THE PROVOCATION ============ */
  .provocation {
    padding-top: 8rem; padding-bottom: 8rem;
  }
  .provocation-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: start;
  }
  .provoke-quote {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    line-height: 1.2;
    letter-spacing: -.015em;
  }
  .provoke-quote .accent {
    color: var(--ember);
    font-style: normal;
    font-weight: 400;
  }
  .provoke-body p {
    color: var(--ink-mute);
    font-size: 1.02rem;
    line-height: 1.7;
    margin-bottom: 1.2rem;
  }
  .provoke-body p strong {
    color: var(--ink);
    font-weight: 500;
  }
  .provoke-body .signature {
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  @media (max-width: 900px){
    .provocation-grid { grid-template-columns: 1fr; gap: 2.5rem; }
  }
 
  /* ============ TOPICS GRID ============ */
  .topics-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 3rem;
    gap: 2rem; flex-wrap: wrap;
  }
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--line-soft);
    border: 1px solid var(--line-soft);
    border-radius: 16px;
    overflow: hidden;
  }
  .topic {
    padding: 2.2rem 1.8rem;
    background: var(--bg);
    position: relative;
    transition: background .35s var(--ease), transform .35s var(--ease);
    display: flex; flex-direction: column;
    min-height: 240px;
    overflow: hidden;
  }
  .topic::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 100% 0%, color-mix(in oklab, var(--ember) 18%, transparent), transparent 60%);
    opacity: 0;
    transition: opacity .45s var(--ease);
    pointer-events: none;
  }
  .topic:hover { background: var(--bg-soft); }
  .topic:hover::before { opacity: 1; }
  .topic-num {
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .15em;
    color: var(--ink-dim);
    margin-bottom: 1.4rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .topic-num .ic {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    color: var(--ink-mute);
    font-size: .88rem;
    transition: all .35s var(--ease);
  }
  .topic:hover .ic {
    color: var(--ember);
    border-color: var(--ember);
    transform: rotate(12deg) scale(1.08);
  }
  .topic-title {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144;
    font-weight: 400;
    font-size: 1.6rem;
    line-height: 1.1;
    letter-spacing: -.015em;
    margin-bottom: .7rem;
  }
  .topic-title em {
    font-style: italic;
    color: var(--ember);
    font-weight: 350;
  }
  .topic-desc {
    color: var(--ink-mute);
    font-size: .93rem;
    line-height: 1.5;
    margin-bottom: 1.4rem;
    flex: 1;
  }
  .topic-link {
    font-family: var(--font-mono);
    font-size: .72rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--ink);
    display: inline-flex; align-items: center; gap: .5rem;
    transition: gap .25s var(--ease);
  }
  .topic:hover .topic-link { gap: .9rem; color: var(--ember); }
  .topic.lab {
    background: color-mix(in oklab, var(--surface) 50%, var(--bg));
  }
  .topic.lab .topic-num .ic {
    background: color-mix(in oklab, var(--electric) 12%, transparent);
    border-color: color-mix(in oklab, var(--electric) 35%, transparent);
    color: var(--electric);
  }
  .topic.lab .topic-title em { color: var(--electric); }
  .topic.lab:hover .ic { color: var(--electric); border-color: var(--electric); }
  .topic.lab:hover .topic-link { color: var(--electric); }
  .lab-tag {
    position: absolute;
    top: 1.4rem; right: 1.4rem;
    font-family: var(--font-mono);
    font-size: .62rem;
    letter-spacing: .15em;
    color: var(--electric);
    border: 1px solid color-mix(in oklab, var(--electric) 40%, transparent);
    padding: .2rem .5rem;
    border-radius: 4px;
    text-transform: uppercase;
  }
  @media (max-width: 900px){
    .topics-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px){
    .topics-grid { grid-template-columns: 1fr; }
  }
 
  /* ============ WAVE / GRID BREATHING ============ */
  .wave-section {
    padding: 4rem 1.5rem;
    border-top: 1px solid var(--line-soft);
    border-bottom: 1px solid var(--line-soft);
    background: var(--bg-soft);
    max-width: 100%;
    overflow: hidden;
  }
  .wave-inner {
    max-width: var(--maxw); margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3rem;
    align-items: center;
  }
  .wave-text .eyebrow { color: var(--electric); }
  .wave-text h3 {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144;
    font-weight: 350;
    font-size: clamp(1.5rem, 2.5vw, 2rem);
    line-height: 1.15;
    letter-spacing: -.02em;
    margin-bottom: 1rem;
  }
  .wave-text h3 em { font-style: italic; color: var(--electric); }
  .wave-text p {
    color: var(--ink-mute);
    line-height: 1.6;
    font-size: .98rem;
  }
  .wave-vis {
    height: 200px;
    position: relative;
    border: 1px solid var(--line-soft);
    border-radius: 12px;
    background: var(--bg);
    overflow: hidden;
  }
  .wave-vis svg {
    width: 100%; height: 100%;
  }
  .wave-vis::before {
    content: "50.00 Hz";
    position: absolute; top: 12px; left: 14px;
    font-family: var(--font-mono);
    font-size: .72rem;
    color: var(--grid);
    letter-spacing: .1em;
    z-index: 2;
  }
  .wave-vis::after {
    content: "NOMINAL";
    position: absolute; top: 12px; right: 14px;
    font-family: var(--font-mono);
    font-size: .68rem;
    color: var(--ink-dim);
    letter-spacing: .15em;
    z-index: 2;
  }
  @media (max-width: 800px){
    .wave-inner { grid-template-columns: 1fr; }
  }
 
  /* ============ ABOUT ============ */
  .about {
    text-align: center;
    padding-top: 8rem; padding-bottom: 6rem;
  }
  .about .eyebrow { justify-content: center; }
  .about .eyebrow::after {
    content: ""; width: 24px; height: 1px; background: currentColor;
  }
  .about h2.display {
    margin-left: auto; margin-right: auto;
  }
  .about .lede {
    margin-left: auto; margin-right: auto;
    margin-bottom: 2.5rem;
  }
  .about-meta {
    display: inline-flex;
    align-items: center;
    gap: 1rem;
    font-family: var(--font-mono);
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    padding-top: 2rem;
    border-top: 1px solid var(--line-soft);
  }
  .about-meta .sep { color: var(--ink-dim); opacity: .4; }
 
  /* ============ FOOTER ============ */
  footer {
    padding: 3rem 1.5rem 2rem;
    border-top: 1px solid var(--line-soft);
    background: var(--bg-soft);
  }
  .footer-inner {
    max-width: var(--maxw); margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 1.5rem; flex-wrap: wrap;
    font-family: var(--font-mono);
    font-size: .74rem;
    letter-spacing: .1em;
    color: var(--ink-dim);
    text-transform: uppercase;
  }
